# Weekly dependency updates (#82). Minor and patch releases arrive as one PR per
# ecosystem; majors stay separate so their changelogs get a real review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /services/bike-resolver
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      resolver-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /services/bike-resolver]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
