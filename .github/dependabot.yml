# Monthly dependency updates (#82). Every PR runs the whole CI (about half an
# hour of runner time), so updates arrive grouped: one PR per ecosystem with
# minor and patch releases. Majors are taken by hand after reading the
# changelog and are never proposed automatically:
# - eslint-plugin-react-hooks 7.1.1 supports the existing ESLint 10; 5.x does not;
# - @types/node follows the Node.js major of the runtime images (24);
# - the node base image stays on the LTS line chosen in the Dockerfiles
#   (odd majors are not LTS; Node 25 no longer ships corepack).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /services/bike-resolver
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      resolver-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /services/bike-resolver]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      base-images:
        patterns: ["*"]
