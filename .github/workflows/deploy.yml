name: Deploy · Production

on:
  workflow_run:
    workflows: ["CI · ColaBike"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    needs: [verify-manual]
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          needs.verify-manual.result == 'success'
        )
      )
    runs-on: [self-hosted, cola-production]
    concurrency:
      group: cola-production
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy exactly the verified main commit
        run: |
          grep -q "COLA_VERIFIED_DEPLOY_V2" /usr/local/sbin/deploy-cola || {
            echo "Install the current ops/deploy-cola on the production VPS"
            exit 1
          }
          sudo -n /usr/local/sbin/deploy-cola "$TARGET_SHA"
