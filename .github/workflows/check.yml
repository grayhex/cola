name: Check ColaBike and resolver
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: npm ci
        working-directory: services/bike-resolver
      - run: npm test && npm run build
        working-directory: services/bike-resolver
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - run: python3 scripts/test-compose.py
      - run: bash scripts/test-backup-drill.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results/
          retention-days: 7
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, cola-production]
    concurrency:
      group: cola-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exactly the checked main commit
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$CHECKED_SHA" ]; then
            echo "Superseded by a newer main commit; skipping stale deployment"
            exit 0
          fi
          grep -q "COLA_VERIFIED_DEPLOY_V2" /usr/local/sbin/deploy-cola || { echo "Install ops/deploy-cola on the VM first (see docs/OPERATIONS.md)"; exit 1; }
          sudo -n /usr/local/sbin/deploy-cola "$CHECKED_SHA"
      - uses: actions/setup-node@v4
        if: contains(github.event.head_commit.message, '[hagsy-demo]')
        with:
          node-version: 22
      - name: Verify deployed demo profile and ride
        if: contains(github.event.head_commit.message, '[hagsy-demo]')
        run: node scripts/verify-hagsy-demo.js
