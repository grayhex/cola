name: CI · ColaBike

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional branch, tag or SHA to test"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to test"
        required: false
        type: string

permissions:
  contents: read

# Automatic PR/main runs supersede only their own predecessors. Manual/reusable
# verification keeps a run-specific key and cannot cancel a deploying caller.
concurrency:
  group: cola-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Freeze the tested commit for every job
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  core:
    name: Application, Resolver and HTTP
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Services are pulled before steps, so a later docker login cannot help.
        image: mirror.gcr.io/library/postgres:17.11-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: services/bike-resolver/package-lock.json
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm-
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Format check
        run: pnpm format:check
      # Zero warnings: the lint debt was cleared in #140; new warnings fail CI.
      - name: Lint
        run: pnpm lint
      # Native strict production TS/TSX, exact generated exception and negative probes.
      - name: Type check
        run: pnpm typecheck && pnpm typecheck:tests && pnpm test:typecheck
      - name: Application unit and database tests
        run: pnpm test
      - name: PostgreSQL records performance budgets and SQL plans
        run: node scripts/explain-records.js > "$RUNNER_TEMP/records-performance.jsonl"
      - name: Records performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: records-performance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/records-performance.jsonl
      - name: Production build
        run: pnpm build
      - run: npm ci
        working-directory: services/bike-resolver
      - name: Resolver tests and build
        run: npm test && npm run build
        working-directory: services/bike-resolver
      - name: HTTP integration including PostgreSQL concurrency checks
        run: pnpm test:integration
      - name: Chat authorization HTTP integration with isolated vendor fixture
        run: node scripts/test-resolver-integration.js --chat

  # The browser suite is split into independent shards per browser (#386): the
  # tests of a project are cut into contiguous equal parts by Playwright itself
  # (`--shard`), each part runs on a runner of its own with its own PostgreSQL,
  # app, Resolver fixture and storage, one worker and no shared state.
  e2e:
    name: Browser · ${{ matrix.project }} · ${{ matrix.shard }}/${{ matrix.total }}
    needs: prepare
    runs-on: ubuntu-latest
    # Includes browser/OS installation, one shard of the suite and visual artifacts.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # No max-parallel: all four shards start together (see docs/operations/ci-cd.md).
      matrix:
        include:
          - { project: chromium, browser: chromium, shard: 1, total: 2 }
          - { project: chromium, browser: chromium, shard: 2, total: 2 }
          - { project: webkit-mobile, browser: webkit, shard: 1, total: 2 }
          - { project: webkit-mobile, browser: webkit, shard: 2, total: 2 }
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17.11-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      COLA_CI_PLAYWRIGHT_PROJECT: ${{ matrix.project }}
      COLA_CI_PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      COLA_CI_PLAYWRIGHT_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
      # The JSON report of this shard, read by the summary job.
      COLA_E2E_REPORT: ${{ github.workspace }}/e2e-evidence/results-${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.total }}.json
      E2E_SHARD_NAME: ${{ matrix.project }}-${{ matrix.shard }}of${{ matrix.total }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: services/bike-resolver/package-lock.json
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm-
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
      - run: npm ci
        working-directory: services/bike-resolver
      # Keep builds local to isolated browser runners, without repeating unit tests.
      - name: Production build for the isolated browser environment
        run: pnpm build
      # The harness passes native --project and --shard; the committed config keeps workers=1.
      - name: Install only this job's browser and system dependencies
        run: pnpm exec playwright install --with-deps "$COLA_CI_PLAYWRIGHT_BROWSER"
      - name: Browser tests with an isolated database and file storage
        run: pnpm test:e2e
      # What this shard was given and the whole list of its project: the summary
      # job proves that the shards together are the whole suite.
      - name: Keep the manifest of this shard
        if: ${{ !cancelled() }}
        run: node scripts/e2e-evidence.js e2e-evidence
      - name: Upload the evidence of this shard
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-evidence-${{ env.E2E_SHARD_NAME }}
          path: e2e-evidence/
          retention-days: 7
          if-no-files-found: error
      # The PNGs of the component review are in their own artifact below, not
      # twice: the two uploads are disjoint.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-review-${{ env.E2E_SHARD_NAME }}
          path: |
            test-results/
            !test-results/**/component*.png
            !test-results/**/account-import*.png
            !test-results/**/rides-import-planned.png
            !test-results/**/popular-carousel.png
            !test-results/**/profile-art-cold*.png
            !test-results/**/chat-*.png
          retention-days: 7
      - name: Component catalog visual review
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: component-review-${{ env.E2E_SHARD_NAME }}
          path: |
            test-results/**/component*.png
            test-results/**/account-import*.png
            test-results/**/rides-import-planned.png
            test-results/**/popular-carousel.png
            test-results/**/profile-art-cold*.png
            test-results/**/chat-*.png
          retention-days: 7

  # Counts and times of all shards, and the proof that none is missing, repeated
  # or red, and that together they are the whole list of every project.
  e2e-summary:
    name: Browser shards · summary
    needs: [prepare, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download the evidence of every shard
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-evidence-*' --dir e2e-evidence
      - name: Timings of the jobs of this run
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
      - name: Every shard reported and together they are the whole list
        run: node scripts/e2e-report.js e2e-evidence --projects chromium,webkit-mobile --shards 2 --jobs jobs.json --summary "$GITHUB_STEP_SUMMARY"
        # Failures are printed by the script as errors after it has written the table.

  operations:
    name: Docker and backup restore
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Compose assertions
        run: |
          python3 scripts/test-compose.py
          python3 scripts/test-deploy-images.py
      - uses: docker/setup-buildx-action@v4
        with:
          # Bootstrap is pulled by Docker; FROM and #syntax by BuildKit.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build final application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: cola-ci-app:${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cola-app
          # Main maintains the shared cache; long PRs may opt in with ci:build-cache.
          cache-to: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ci:build-cache')) && 'type=gha,scope=cola-app,mode=max' || '' }}
      - name: Build migration and operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ops
          load: true
          push: false
          tags: cola-ci-ops:${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cola-ops
          # Main maintains the shared cache; long PRs may opt in with ci:build-cache.
          cache-to: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ci:build-cache')) && 'type=gha,scope=cola-ops,mode=max' || '' }}
      - name: Build final Resolver image
        uses: docker/build-push-action@v7
        with:
          context: services/bike-resolver
          load: true
          push: false
          tags: cola-ci-resolver:${{ needs.prepare.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cola-resolver
          cache-to: type=gha,scope=cola-resolver,mode=max
      - name: Shared ops image cold-start contract
        env:
          COLA_TEST_OPS_IMAGE: cola-ci-ops:${{ needs.prepare.outputs.sha }}
        run: bash scripts/test-shared-ops.sh
      - name: Cache the Compose PostgreSQL image from the public mirror
        run: |
          db_image="$(docker compose -f compose.yaml config --format json | jq -r '.services.db.image')"
          docker pull "mirror.gcr.io/library/$db_image"
          docker tag "mirror.gcr.io/library/$db_image" "$db_image"
      - name: Final-image migrations, runtime and backup restore drill
        env:
          COLA_TEST_OPS_IMAGE: cola-ci-ops:${{ needs.prepare.outputs.sha }}
          COLA_TEST_APP_IMAGE: cola-ci-app:${{ needs.prepare.outputs.sha }}
          COLA_TEST_RESOLVER_IMAGE: cola-ci-resolver:${{ needs.prepare.outputs.sha }}
        run: bash scripts/test-backup-drill.sh
      - name: Package and round-trip the tested deployment images
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/production-images"
          docker image save "cola-ci-app:$TESTED_SHA" "cola-ci-ops:$TESTED_SHA" "cola-ci-resolver:$TESTED_SHA" \
            | gzip -1 > "$RUNNER_TEMP/production-images/images.tar.gz"
          python3 scripts/test-deploy-images.py --docker "$TESTED_SHA" "$RUNNER_TEMP/production-images/images.tar.gz"
      - name: Set up a separate containerd image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - name: Verify the same tested archive on containerd
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          docker info --format '{{json .DriverStatus}}' | python3 -c 'import json, sys; assert ["driver-type", "io.containerd.snapshotter.v1"] in json.load(sys.stdin)'
          python3 scripts/test-deploy-images.py --docker "$TESTED_SHA" "$RUNNER_TEMP/production-images/images.tar.gz"
      - name: Publish tested main images for production
        if: >-
          github.repository == 'grayhex/cola' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: production-images-${{ needs.prepare.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-images/images.tar.gz
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  # Preserve the required status "check": skip, cancellation and failure cannot pass.
  check:
    needs: [prepare, core, e2e, e2e-summary, operations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every verification group to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CORE_RESULT: ${{ needs.core.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_SUMMARY_RESULT: ${{ needs.e2e-summary.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          {
            echo "### CI verification"
            echo "Commit: $TESTED_SHA"
            echo ""
            echo "| Group | Result |"
            echo "| --- | --- |"
            echo "| Prepare | $PREPARE_RESULT |"
            echo "| Application, Resolver, HTTP | $CORE_RESULT |"
            echo "| Chromium and mobile WebKit, every shard | $E2E_RESULT |"
            echo "| Shards add up to the whole list | $E2E_SUMMARY_RESULT |"
            echo "| Docker and backup/restore | $OPERATIONS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$PREPARE_RESULT" "$CORE_RESULT" "$E2E_RESULT" "$E2E_SUMMARY_RESULT" "$OPERATIONS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::All CI groups must succeed; inspect the job summary."
              exit 1
            fi
          done
