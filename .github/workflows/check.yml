name: CI · ColaBike

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional branch, tag or SHA to test"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to test"
        required: false
        type: string

permissions:
  contents: read

# Automatic PR/main runs supersede only their own predecessors. Manual/reusable
# verification keeps a run-specific key and cannot cancel a deploying caller.
concurrency:
  group: cola-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Freeze the tested commit for every job
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  core:
    name: Application, Resolver and HTTP
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/bike-resolver/package-lock.json
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: ${{ runner.os }}-node22-pnpm-
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
      # Errors fail the build; warnings are the backlog shown in the log (#82).
      - name: Lint
        run: pnpm lint
      - name: Application unit and database tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - run: npm ci
        working-directory: services/bike-resolver
      - name: Resolver tests and build
        run: npm test && npm run build
        working-directory: services/bike-resolver
      - name: HTTP integration including PostgreSQL concurrency checks
        run: pnpm test:integration

  e2e:
    name: Browser · ${{ matrix.project }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit-mobile
            browser: webkit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      COLA_CI_PLAYWRIGHT_PROJECT: ${{ matrix.project }}
      COLA_CI_PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/bike-resolver/package-lock.json
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-node22-pnpm-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: ${{ runner.os }}-node22-pnpm-
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
      - run: npm ci
        working-directory: services/bike-resolver
      # Keep builds local to isolated browser runners, without repeating unit tests.
      - name: Production build for the isolated browser environment
        run: pnpm build
      # The harness passes native --project; the committed config keeps workers=1.
      - name: Install only this job's browser and system dependencies
        run: pnpm exec playwright install --with-deps "$COLA_CI_PLAYWRIGHT_BROWSER"
      - name: Browser tests with an isolated database and file storage
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-review-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  operations:
    name: Docker and backup restore
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Compose assertions
        run: python3 scripts/test-compose.py
      - uses: docker/setup-buildx-action@v4
      - name: Build final application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cola-ci-app:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cola-app
          cache-to: type=gha,scope=cola-app,mode=max
      - name: Build final Resolver image
        uses: docker/build-push-action@v7
        with:
          context: services/bike-resolver
          load: true
          push: false
          tags: cola-ci-resolver:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=cola-resolver
          cache-to: type=gha,scope=cola-resolver,mode=max
      - name: Final-image migrations, runtime and backup restore drill
        env:
          COLA_TEST_APP_IMAGE: cola-ci-app:${{ needs.prepare.outputs.sha }}
          COLA_TEST_RESOLVER_IMAGE: cola-ci-resolver:${{ needs.prepare.outputs.sha }}
        run: bash scripts/test-backup-drill.sh

  # Preserve the required status "check": skip, cancellation and failure cannot pass.
  check:
    needs: [prepare, core, e2e, operations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every verification group to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CORE_RESULT: ${{ needs.core.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          {
            echo "### CI verification"
            echo "Commit: $TESTED_SHA"
            echo ""
            echo "| Group | Result |"
            echo "| --- | --- |"
            echo "| Prepare | $PREPARE_RESULT |"
            echo "| Application, Resolver, HTTP | $CORE_RESULT |"
            echo "| Chromium and mobile WebKit | $E2E_RESULT |"
            echo "| Docker and backup/restore | $OPERATIONS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$PREPARE_RESULT" "$CORE_RESULT" "$E2E_RESULT" "$OPERATIONS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::All CI groups must succeed; inspect the job summary."
              exit 1
            fi
          done
