            {"@context":"https:\/\/schema.org\/","@type":"Product","@id":"https:\/\/www.alltricks.fr\/F-41484-cadres-rigides\/P-2768313-cadre_bmx_race_meybo_hsx_carbon_noir_gris_2024","name":"Cadre BMX Race Meybo HSX Carbon Noir Gris 2024","image":"https:\/\/product-cdn-frz.alltricks.com\/medium\/302\/651302\/2651302\/5331161","description":"Le Meybo HSX Carbon est une pi\u00e8ce de comp\u00e9tition capable de remporter les plus grands championnats. Dot\u00e9 d'une rigidit\u00e9 accrue et d'une technologie avant-gardiste, ce cadre en carbone est l'excellence m\u00eame. L\u00e9ger, r\u00e9actif, stable et rigide, il offre tous les avantages recherch\u00e9s dans un unique cadre. Le HSX Carbon est le cadre de BMX Race le plus performant et le plus rapide de la marque n\u00e9erlandaise. Sa g\u00e9om\u00e9trie a \u00e9t\u00e9 sp\u00e9cialement con\u00e7ue pour les pistes des championnats et des coupes du monde, offrant un \u00e9quilibre parfait entre maniabilit\u00e9 et stabilit\u00e9 \u00e0 des vitesses tr\u00e8s \u00e9lev\u00e9es.\r\n\r\nPour le mod\u00e8le 2024, plusieurs sp\u00e9cifications importantes doivent \u00eatre prises en compte. En ce qui concerne le freinage, ce cadre est uniquement compatible avec des \u00e9triers Flat-Mount. Cela signifie que l'\u00e9trier de frein est directement fix\u00e9 sur la base arri\u00e8re du cadre. Pour une finition optimale, deux vis de fixation traversent la base arri\u00e8re du cadre pour maintenir l'\u00e9trier de frein en place. Cependant, Cette configuration ne fonctionne qu'avec des disques de 120 mm ; le cadre n'est pas compatible avec des disques de 140 mm.\r\n\r\nSelon les tailles de cadre, le bo\u00eetier de p\u00e9dalier passe du standard BB86 \u00e0 un BB386. Pour les tailles Expert, Expert XL et Pro, il s'agit d'un BB86 (\u00d8 41 mm), alors que pour les tailles sup\u00e9rieures, il est question d'un Pressfit BB386 (\u00d8 46 mm). Cela permet d'ins\u00e9rer un axe de p\u00e9dalier de 30 mm sans compromettre l'\u00e9paisseur des roulements. Il est important de choisir la bonne r\u00e9f\u00e9rence en fonction de l'axe de p\u00e9dalier souhait\u00e9, car ce bo\u00eetier de p\u00e9dalier est sp\u00e9cifique.\r\n\r\nAfin de maintenir une longueur de bases arri\u00e8re constante quel que soit le d\u00e9veloppement utilis\u00e9, ce cadre est livr\u00e9 avec un axe traversant de 15 mm. Cela augmente consid\u00e9rablement la rigidit\u00e9 de la partie arri\u00e8re du cadre. Cette configuration n\u00e9cessite obligatoirement un moyeu arri\u00e8re avec un axe de 15 mm. L'axe lui-m\u00eame est en aluminium 7005, enti\u00e8rement usin\u00e9 par CNC. Pour maintenir une tension de cha\u00eene constante, Meybo a con\u00e7u un tendeur de cha\u00eene qui assure une transmission optimale quel que soit le d\u00e9veloppement choisi. Pour optimiser le r\u00e9glage de la tension de cha\u00eene avec ce tendeur, il est conseill\u00e9 d'utiliser une cha\u00eene dot\u00e9e de demi-maillons pour un r\u00e9glage plus pr\u00e9cis.\r\n\r\nEn r\u00e9sum\u00e9, le mod\u00e8le Meybo HSX Carbon 2024 est une concentration de nouvelles technologies avec des tubes en carbone T800 Toray. Con\u00e7u et pr\u00e9vu pour la comp\u00e9tition, que ce soit \u00e0 grande vitesse sur une piste de coupe du monde ou en premi\u00e8re position sur un circuit en salle, le HSX est une arme redoutable pour la course.\r\n\r\nD\u00e9tails :\r\n\r\n\r\n\tCadre 100 % Carbone Toray T800.\r\n\tCompatible uniquement avec les freins \u00e0 disque de type \"Flat-Mount\".\r\n\tBoitier de p\u00e9dalier BB86 (\u00d8 41 mm) ou BB386 (\u00d8 46 mm) en fonction des tailles.\r\n\tPossibilit\u00e9 d'installer un p\u00e9dalier avec axe de 24 ou 30 mm.\r\n\tTendeur de chaine int\u00e9gr\u00e9 au cadre sur la base arri\u00e8re.\r\n\tLa marque recommande d'utiliser une chaine demi-maillons pour le r\u00e9glage de la transmission.\r\n\tLivr\u00e9 avec un axe arri\u00e8re traversant fixe de 15 mm con\u00e7u en aluminium 7005 (compl\u00e8tement usin\u00e9 CNC).\r\n\tCompatible avec des roues OS20.\r\n\tCollier de selle int\u00e9gr\u00e9 dans le cadre.\r\n\tPoids : 1376 g (taille Pro 21.5).\r\n\tColoris : Black \/ Grey \/ Silver \/ Grey.\r\n\r\n\r\nG\u00e9om\u00e9tries :\r\n\r\n\r\n\t\r\n\t\t\r\n\t\t\tTaille cadre\r\n\t\t\tExpert\r\n\t\t\tExpert XL\r\n\t\t\tPro 21\r\n\t\t\tPro 21.5 \/ Pro XL\r\n\t\t\tPro 22 \/ Pro XXL\r\n\t\t\tPro 22.5 \/ Pro 3XL\r\n\t\t\tPro 23 \/ Pro 4XL\r\n\t\t\tCruiser Pro 22\r\n\t\t\r\n\t\t\r\n\t\t\tTube sup\u00e9rieur (mm)\r\n\t\t\t500\r\n\t\t\t525\r\n\t\t\t536\r\n\t\t\t546\r\n\t\t\t558\r\n\t\t\t571\r\n\t\t\t583\r\n\t\t\t564\r\n\t\t\r\n\t\t\r\n\t\t\tTube diagonal (mm)\r\n\t\t\t506\r\n\t\t\t530\r\n\t\t\t534\r\n\t\t\t543\r\n\t\t\t555\r\n\t\t\t566\r\n\t\t\t579\r\n\t\t\t577\r\n\t\t\r\n\t\t\r\n\t\t\tLongueur base (mm)\r\n\t\t\t340\r\n\t\t\t345\r\n\t\t\t369\r\n\t\t\t380\r\n\t\t\t386\r\n\t\t\t393\r\n\t\t\t397\r\n\t\t\t393\r\n\t\t\r\n\t\t\r\n\t\t\tType de douille de direction\r\n\t\t\t1 1\/8\"\r\n\t\t\t1 1\/8\"\r\n\t\t\tTapered 1 1\/8\" - 1.5\"\r\n\t\t\tTapered 1 1\/8\" - 1.5\"\r\n\t\t\tTapered 1 1\/8\" - 1.5\"\r\n\t\t\tTapered 1 1\/8\" - 1.5\"\r\n\t\t\tTapered 1 1\/8\" - 1.5\"\r\n\t\t\tTapered 1 1\/8\" - 1.5\"\r\n\t\t\r\n\t\t\r\n\t\t\tAngle de direction (\u00b0)\r\n\t\t\t73.5\r\n\t\t\t73.5\r\n\t\t\t74\r\n\t\t\t74\r\n\t\t\t74\r\n\t\t\t74\r\n\t\t\t74.3\r\n\t\t\t74\r\n\t\t\r\n\t\t\r\n\t\t\tAngle tube de selle (\u00b0)\r\n\t\t\t71\r\n\t\t\t71\r\n\t\t\t71\r\n\t\t\t71\r\n\t\t\t71\r\n\t\t\t71\r\n\t\t\t71\r\n\t\t\t70.5\r\n\t\t\r\n\t\t\r\n\t\t\tDiam\u00e8tre tige de selle (mm)\r\n\t\t\t25.4\r\n\t\t\t25.4\r\n\t\t\t27.2\r\n\t\t\t27.2\r\n\t\t\t27.2\r\n\t\t\t27.2\r\n\t\t\t27.2\r\n\t\t\t27.2\r\n\t\t\r\n\t\t\r\n\t\t\tBo\u00eetier de p\u00e9dalier (mm)\r\n\t\t\tBB86 (\u00d8 41)\r\n\t\t\tBB86 (\u00d8 41)\r\n\t\t\tBB86 (\u00d8 41)\r\n\t\t\tBB386 EVO (\u00d8 46)\r\n\t\t\tBB386 EVO (\u00d8 46)\r\n\t\t\tBB386 EVO (\u00d8 46)\r\n\t\t\tBB386 EVO (\u00d8 46)\r\n\t\t\tBB386 EVO (\u00d8 46)","url":"https:\/\/www.alltricks.fr
