allowBuilds:
  sharp: true
  # Published SDKs are prebuilt; their postinstall only installs contributor Husky hooks.
  stream-chat: false
  stream-chat-react: false

# Keep the @types/pg wildcard on the same Node major as the runtime and root types.
overrides:
  "@types/pg>@types/node": 24.13.6

strictPeerDependencies: true
