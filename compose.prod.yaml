# Standalone production file; do NOT merge with compose.yaml.
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: colabike
      POSTGRES_USER: colabike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colabike -d colabike"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:3000:3000"
    environment: &app-environment
      DATABASE_URL: postgresql://colabike:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/colabike
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE}
      DEPLOYMENT_MODE: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TRUSTED_PROXY_KEY: ${TRUSTED_PROXY_KEY:?Set TRUSTED_PROXY_KEY}
      BIKE_RESOLVER_TOKEN: ${BIKE_RESOLVER_TOKEN:?Set BIKE_RESOLVER_TOKEN}
      UPLOAD_DIR: /app/uploads
      RIDES_DIR: /app/rides
      CSP_MODE: ${CSP_MODE:-report-only}
      CSP_MAP_ORIGINS: ${CSP_MAP_ORIGINS:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      MAX_BIKES_PER_USER: ${MAX_BIKES_PER_USER:-}
      MAX_PHOTOS_PER_USER: ${MAX_PHOTOS_PER_USER:-}
      MAX_PHOTO_BYTES_PER_USER: ${MAX_PHOTO_BYTES_PER_USER:-}
      BIKE_CREATES_PER_15_MIN: ${BIKE_CREATES_PER_15_MIN:-}
      PHOTO_UPLOADS_PER_15_MIN: ${PHOTO_UPLOADS_PER_15_MIN:-}
      BIKE_RESOLVER_URL: http://bike-resolver:8080
      ERROR_TRACKER_DSN: ${ERROR_TRACKER_DSN:-}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-}
      MEDIA_CACHE_MAX_MB: ${MEDIA_CACHE_MAX_MB:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STREAM_CHAT_ENABLED: ${STREAM_CHAT_ENABLED:-false}
      STREAM_CHAT_API_KEY: ${STREAM_CHAT_API_KEY:-}
      STREAM_CHAT_API_SECRET: ${STREAM_CHAT_API_SECRET:-}
      RWGPS_ENABLED: ${RWGPS_ENABLED:-false}
      RWGPS_API_KEY: ${RWGPS_API_KEY:-}
      RWGPS_CLIENT_ID: ${RWGPS_CLIENT_ID:-}
      RWGPS_CLIENT_SECRET: ${RWGPS_CLIENT_SECRET:-}
      YANDEX_ID_ENABLED: ${YANDEX_ID_ENABLED:-false}
      YANDEX_ID_CLIENT_ID: ${YANDEX_ID_CLIENT_ID:-}
      YANDEX_ID_CLIENT_SECRET: ${YANDEX_ID_CLIENT_SECRET:-}
      DEVICE_ACCESS_TOKEN_MINUTES: ${DEVICE_ACCESS_TOKEN_MINUTES:-15}
      DEVICE_REFRESH_IDLE_DAYS: ${DEVICE_REFRESH_IDLE_DAYS:-60}
      DEVICE_REFRESH_ABSOLUTE_DAYS: ${DEVICE_REFRESH_ABSOLUTE_DAYS:-180}
      ACTIVITY_TOKEN_KEY: ${ACTIVITY_TOKEN_KEY:-}
    volumes:
      - photos:/app/uploads
      - rides:/app/rides
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  migrate:
    # Build/export ops once; the worker below consumes this same local image.
    image: ${COMPOSE_PROJECT_NAME:-cola}-ops:local
    pull_policy: never
    build:
      context: .
      target: ops
    environment: *app-environment
    volumes:
      - photos:/app/uploads
      - rides:/app/rides
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  chat-sync:
    image: ${COMPOSE_PROJECT_NAME:-cola}-ops:local
    pull_policy: never
    command: ["node", "scripts/chat-sync.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  activity-sync:
    image: ${COMPOSE_PROJECT_NAME:-cola}-ops:local
    pull_policy: never
    command: ["node", "scripts/activity-sync.js"]
    environment: *app-environment
    volumes:
      - rides:/app/rides
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  notification-email:
    image: ${COMPOSE_PROJECT_NAME:-cola}-ops:local
    pull_policy: never
    command: ["node", "scripts/notification-email.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  bike-week:
    image: ${COMPOSE_PROJECT_NAME:-cola}-ops:local
    pull_policy: never
    command: ["node", "scripts/bike-week.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  bike-resolver:
    build: ./services/bike-resolver
    expose:
      - "8080"
    environment:
      PORT: 8080
      BIKE_RESOLVER_TOKEN: ${BIKE_RESOLVER_TOKEN:?Set BIKE_RESOLVER_TOKEN}
      DATABASE_URL: postgresql://colabike:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/colabike
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  database:
  photos:
  rides:
