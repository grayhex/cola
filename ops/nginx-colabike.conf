# Install into /etc/nginx/conf.d/ after obtaining certificates with your ACME client.
# Replace REPLACE_WITH_TRUSTED_PROXY_KEY with the same random value as app env.
# This proxy terminates the client connection directly; do not enable real_ip_header
# for arbitrary networks. Add CDN trust only with its documented address allowlist.
limit_req_zone $binary_remote_addr zone=cola_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cola_api:10m rate=10r/s;
server {
    listen 80;
    server_name colabike.ru;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://colabike.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name colabike.ru;
    ssl_certificate /etc/letsencrypt/live/colabike.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colabike.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    client_body_timeout 20s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Cola-Client-IP $remote_addr;
    proxy_set_header X-Cola-Proxy-Key REPLACE_WITH_TRUSTED_PROXY_KEY;
    location /api/auth/ {
        limit_req zone=cola_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/ {
        limit_req zone=cola_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
}
